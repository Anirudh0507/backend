
spring.application.name=SubTrack
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/subtrack_db
spring.datasource.username=subtrack_user
spring.datasource.password=${SUBTRACK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

